name: Validate handbook
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install docs renderer
        run: python -m pip install 'mistune>=3,<4'
      - name: Build and test
        run: |
          python build.py
          python -m unittest discover -s tests -v
          node tests/math.test.js
          node --check assets/app.js
